<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Knole</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf9f6;
        color: #2b2a27;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #14130f;
          color: #ece8df;
        }
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        gap: 0.75rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 2.4rem;
        margin: 0;
        font-weight: 400;
      }
      p {
        max-width: 34ch;
        line-height: 1.6;
        color: #7a766c;
        font-size: 0.95rem;
      }
      button {
        margin-top: 0.5rem;
        border: none;
        border-radius: 999px;
        background: #2b2a27;
        color: #faf9f6;
        padding: 0.6rem 1.2rem;
        font-size: 0.85rem;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #ece8df;
          color: #14130f;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>
        Knole needs a connection to reach your private, encrypted words. It's all still here —
        waiting for you when you're back.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
