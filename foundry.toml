# Foundry config for the KnoleAgenticID (ERC-7857) contract suite.
# Tests live in contracts/test; deps resolve from node_modules (npm-managed, incl. forge-std).
[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
cache_path = "cache_forge"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
