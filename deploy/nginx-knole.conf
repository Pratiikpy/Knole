server {
    listen 80;
    listen [::]:80;
    server_name knole.me www.knole.me;

    # Voice notes and images are uploaded through the app.
    client_max_body_size 25M;

    # Static build output is served straight off disk; everything else is the SSR app. try_files
    # only matches real files, so SSR routes like /stats are never shadowed by it.
    root /home/ubuntu/knole/dist/client;

    location /assets/ {
        # Vite fingerprints these filenames, so they can never go stale.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @app;
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Load-bearing: with buffering on, nginx holds the whole response and the reflection, chat
        # and Ask replies arrive in one lump instead of token by token — the product's core feel.
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;

        # A sealed-inference reflection can run for minutes; nginx must not cut it short.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
